name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

jobs:
  validate:
    name: Lint, Typecheck, Build, and Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_APP_NAME: "Horode Proof"
          SUPABASE_URL: "https://placeholder-project.supabase.co"
          SUPABASE_ANON_KEY: "placeholder-anon-key-for-ci-build"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key-for-ci-build"
          DEFAULT_RETENTION_DAYS: "30"
        run: npm run build

      - name: Dependency Security Audit
        run: npm run audit || true
